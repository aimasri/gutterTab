<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38e2fc"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <g id="tabBentoGroup">
      <rect x="36" y="36" width="162" height="64" rx="8" fill="url(#g1)"/>
      <rect x="36"  y="108" width="77" height="50" rx="7" fill="url(#g3)"/>
      <rect x="121" y="108" width="77" height="50" rx="7" fill="url(#g5)"/>
      <rect x="36"  y="166" width="58" height="54" rx="7" fill="url(#g7)"/>
      <rect x="102" y="166" width="96" height="54" rx="7" fill="url(#g9)"/>
      <rect x="206" y="36" width="14" height="184" rx="5" fill="url(#spineGrad)"/>
    </g>
  </defs>
  <rect width="900" height="300" fill="#0d0e15"/>

  <!-- Bento precisely centered at Y=150 -->
  <g transform="translate(60, 2.85) scale(1.15)">
    <use href="#tabBentoGroup"/>
  </g>

  <!-- Typography precisely centered at Y=150 -->
  <g transform="translate(340, 0)">
    <text x="0" y="157"
          font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', -apple-system, sans-serif"
          font-size="82" font-weight="400" letter-spacing="-1.5px">
      <tspan fill="#F8FAFC" font-weight="400">gutter</tspan><tspan fill="url(#tabGrad)" font-weight="800">Tab</tspan>
    </text>
    <text x="4" y="195"
          font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif"
          font-size="16" font-weight="500" letter-spacing="2.5px" fill="#94A3B8">
      Edge-Docked Note &amp; Prompt Daemon
    </text>
  </g>
</svg>