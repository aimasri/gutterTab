<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924"/>
      <stop offset="100%" stop-color="#0b0c12"/>
    </linearGradient>

    <!-- Palette Gradients -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#38e2fc"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fdba74"/><stop offset="100%" stop-color="#fb923c"/></linearGradient>
    <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>

    <!-- Tab Text Gradient -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Ambient Glow Behind Icon -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="720" fill="#0d0e15"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="400" cy="240" r="230" fill="url(#ambientGlow)" filter="url(#softGlow)"/>

  <!-- ================= ICON SQUIRCLE ================= -->
  <g transform="translate(220, 60)">
    <!-- Drop Shadow -->
    <rect x="14" y="24" width="332" height="332" rx="78.75" ry="78.75" fill="#000000" opacity="0.65" filter="url(#shadowBlur)"/>

    <!-- Squircle Base -->
    <rect x="14" y="14" width="332" height="332" rx="78.75" ry="78.75" fill="url(#iconBgGrad)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3.2"/>

    <g transform="scale(1.40625)">
      <rect x="36" y="36" width="162" height="64" rx="8" ry="8" fill="url(#g1)"/>
      <rect x="36"  y="108" width="77" height="50" rx="7" ry="7" fill="url(#g3)"/>
      <rect x="121" y="108" width="77" height="50" rx="7" ry="7" fill="url(#g5)"/>
      <rect x="36"  y="166" width="58" height="54" rx="7" ry="7" fill="url(#g7)"/>
      <rect x="102" y="166" width="96" height="54" rx="7" ry="7" fill="url(#g9)"/>
      <rect x="206" y="36" width="14" height="184" rx="5" ry="5" fill="url(#spineGrad)"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY UNDERNEATH ================= -->
  <text x="400" y="505" text-anchor="middle"
        font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', -apple-system, sans-serif"
        font-size="82" font-weight="400" letter-spacing="-1.5px">
    <tspan fill="#F8FAFC" font-weight="400">gutter</tspan><tspan fill="url(#tabGrad)" font-weight="800">Tab</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="400" y="562" text-anchor="middle"
        font-family="'Inter', 'Liberation Sans', 'DejaVu Sans', sans-serif"
        font-size="13.5" font-weight="700" letter-spacing="9.5px" fill="#94A3B8">
    EDGE-DOCKED NOTE &amp; PROMPT DAEMON
  </text>

  <!-- Mini Signature Color Palette Accent -->
  <g transform="translate(341, 595)">
    <rect x="0"   y="0" width="8" height="3.5" rx="1.75" fill="#06b6d4"/>
    <rect x="13"  y="0" width="8" height="3.5" rx="1.75" fill="#38bdf8"/>
    <rect x="26"  y="0" width="8" height="3.5" rx="1.75" fill="#6366f1"/>
    <rect x="39"  y="0" width="8" height="3.5" rx="1.75" fill="#a855f7"/>
    <rect x="52"  y="0" width="8" height="3.5" rx="1.75" fill="#ec4899"/>
    <rect x="65"  y="0" width="8" height="3.5" rx="1.75" fill="#f43f5e"/>
    <rect x="78"  y="0" width="8" height="3.5" rx="1.75" fill="#fb923c"/>
    <rect x="91"  y="0" width="8" height="3.5" rx="1.75" fill="#eab308"/>
    <rect x="104" y="0" width="8" height="3.5" rx="1.75" fill="#10b981"/>
    <rect x="117" y="0" width="8" height="3.5" rx="1.75" fill="#00f2fe"/>
  </g>
</svg>
